<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Emberfall Online - 2D MMORPG เล่นบนเบราว์เซอร์ รองรับจอยและมือถือ">
<title>Emberfall Online</title>
<link rel="stylesheet" href="/client/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🔥</text></svg>">
</head>
<body>
<canvas id="game"></canvas>

<!-- ======================= HUD ======================= -->
<div id="hud" class="hidden">
  <div id="vitals">
    <div class="portrait" id="portrait"></div>
    <div class="bars">
      <div class="name-row"><span id="me-name">-</span><span id="me-job" class="muted"></span></div>
      <div class="bar hp"><i id="bar-hp"></i><span id="txt-hp"></span></div>
      <div class="bar sp"><i id="bar-sp"></i><span id="txt-sp"></span></div>
      <div class="bar exp"><i id="bar-exp"></i><span id="txt-exp"></span></div>
      <div class="bar jexp"><i id="bar-jexp"></i><span id="txt-jexp"></span></div>
    </div>
  </div>

  <div id="target-frame" class="hidden">
    <div class="name-row"><span id="tg-name"></span><span id="tg-lv" class="muted"></span></div>
    <div class="bar hp small"><i id="tg-hp"></i></div>
    <div id="tg-el" class="muted"></div>
  </div>

  <div id="topright">
    <div id="zone-name"></div>
    <div id="purse"><span id="aurum">0</span> <b>AU</b></div>
    <div id="netinfo" class="muted"></div>
    <canvas id="minimap" width="140" height="140"></canvas>
  </div>

  <div id="cast-bar" class="hidden"><i></i><span></span></div>
  <div id="statuses"></div>

  <div id="hotbar"></div>

  <div id="menu-buttons">
    <button data-panel="character" title="ตัวละคร (C)">👤</button>
    <button data-panel="inventory" title="กระเป๋า (I)">🎒</button>
    <button data-panel="skills" title="สกิล (K)">✨</button>
    <button data-panel="quests" title="ภารกิจ (J)">📜</button>
    <button data-panel="party" title="ปาร์ตี้ (P)">👥</button>
    <button data-panel="help" title="วิธีเล่น (F1)">❓</button>
  </div>
</div>

<!-- ======================= touch controls ======================= -->
<div id="touch" class="hidden">
  <div id="stick"><div id="stick-knob"></div></div>
  <div id="buttons">
    <button data-action="skill3" class="tbtn small">3</button>
    <button data-action="skill4" class="tbtn small">4</button>
    <button data-action="skill1" class="tbtn small">1</button>
    <button data-action="skill2" class="tbtn small">2</button>
    <button data-action="interact" class="tbtn">✋</button>
    <button data-action="attack" class="tbtn big">⚔</button>
  </div>
  <button data-action="targetNext" id="btn-target" class="tbtn small">🎯</button>
</div>

<!-- ======================= chat ======================= -->
<div id="chat" class="hidden">
  <div id="chat-log"></div>
  <form id="chat-form">
    <select id="chat-ch">
      <option value="say">รอบตัว</option>
      <option value="party">ปาร์ตี้</option>
      <option value="trade">ซื้อขาย</option>
      <option value="world">โลก</option>
    </select>
    <input id="chat-input" maxlength="200" placeholder="พิมพ์ข้อความ… (Enter)" autocomplete="off">
  </form>
</div>

<!-- ======================= panels ======================= -->
<div id="panels"></div>
<div id="toasts"></div>

<!-- ======================= screens ======================= -->
<div id="screen" class="screen">
  <div class="screen-card">
    <h1>Emberfall <span>Online</span></h1>
    <p class="tag">2D MMORPG บนเบราว์เซอร์ • รองรับจอยเกม • เงินหายาก ของมีค่า</p>
    <div id="screen-body"></div>
    <div id="screen-error" class="err"></div>
    <p class="credit">งานศิลป์: Universal LPC Spritesheet (CC-BY-SA 3.0 / GPL 3.0)</p>
  </div>
</div>

<script type="module" src="/client/js/main.js"></script>
</body>
</html>
